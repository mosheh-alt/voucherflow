<body class="mgmt">
<div class="login" id="login" hidden>
  <h1>Toirem Management</h1>
  <p>Sign in to continue.</p>
  <form id="loginForm">
    <div class="lfield"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="lfield"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required></div>

  </form>
</div>

<div class="mapp" id="shell" hidden>
  <nav class="side" aria-label="Main">
    <div class="brand"><b>Toirem</b><span>Management</span></div>
    <div class="navhead">Donations</div>
    <a class="navlink" href="/#inbox">Inbox</a>
    <a class="navlink" href="/#prepare">Receipts to prepare</a>
    <a class="navlink" href="/#receipts">Receipts</a>
    <a class="navlink" href="/#settings">Settings</a>
    <div class="navhead">Compliance</div>
    <a class="navlink" href="/grants/office.html#" aria-current="page">Grant applications</a>
    <a class="navlink ext" href="/grants/apply.html" target="_blank" rel="noopener">Application form</a>
    <div class="spacer"></div>
    <div class="who" id="who"></div>
    <button class="navlink" type="button" id="signout">Sign out</button>
  </nav>
  <main class="mmain"><div id="app"><p class="loading">Loading…</p></div></main>
</div>
